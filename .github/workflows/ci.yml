# CI: apply_bot 无浏览器回归测试。
#
# 刻意不做的事:门户 CLI 的真机冒烟测试——它们会请求真实招聘站点
# (网络不稳定,且部分站点条款禁止自动化访问),真机验证保持在本地按需执行。
#
# Actions 按提交 SHA 固定,token 只读。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: apply_bot regression (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run apply_bot core regression tests
        run: python automation/apply_bot/tests/test_core.py
      - name: CV template identity guard
        run: python tests/test_cv_identity_guard.py
      - name: Python syntax check (all automation code)
        run: python -m compileall automation -q
